<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CDK Bootstrap Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    #version, #dsql {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>CDK Bootstrap Status</h1>
  <p>SSM parameter <code>/cdk-bootstrap/hnb659fds/version</code>: <span id="version">loading...</span></p>
  <p>Aurora DSQL <code>SELECT 1</code>: <span id="dsql">loading...</span></p>

  <script>
    fetch("/api/")
      .then((response) => response.json())
      .then((data) => {
        document.getElementById("version").textContent = data.cdk_bootstrap_version;

        const dsql = data.dsql || {};
        document.getElementById("dsql").textContent = dsql.ok
          ? "ok (returned " + dsql.result + ")"
          : "failed (" + (dsql.error || "unknown") + ")";
      })
      .catch(() => {
        document.getElementById("version").textContent = "unavailable";
        document.getElementById("dsql").textContent = "unavailable";
      });
  </script>
</body>
</html>
