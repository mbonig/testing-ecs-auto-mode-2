schemaVersion: 1

app:
  name: testing-ecs-truly-auto-mode
  dockerfile: Dockerfile
  buildContext: .

target:
  account: "581514672367"
  region: us-east-1
  ssmPrefix: /ecs-auto-mode/testing-ecs-truly-auto-mode
  cdkQualifier: hnb659fds

analysis:
  buildValidated: true

  architecture:
    value: ARM64
    confidence: high
    confirmedByUser: true
    # No --platform, no arch-specific tag, no downloaded binary — nothing in the
    # Dockerfile pinned this. Asked in Phase 2; user confirmed ARM64.
    evidence:
      - file: Dockerfile
        line: 1
        excerpt: "FROM python:3.12-slim"

  container:
    port:
      value: 8080
      confidence: high
      evidence:
        - file: Dockerfile
          line: 10
          excerpt: "EXPOSE 8080"
        - file: app.py
          line: 153
          excerpt: 'app.run(host="0.0.0.0", port=8080)'
    healthCheck:
      type:
        value: http
        confidence: high
        evidence:
          - file: app.py
            line: 136
            excerpt: '@app.route("/api/")'
      path:
        value: /api/
        confidence: high
        evidence:
          - file: app.py
            line: 136
            excerpt: '@app.route("/api/")'
          - file: app.py
            line: 149
            excerpt: 'return jsonify({"cdk_bootstrap_version": version, "dsql": check_dsql()})'
          - file: openspec/changes/add-dsql-health-check/design.md
            excerpt: "the ALB health check points at /api/, and this endpoint must keep returning 200"

  # All four egress sources checked (HTTP clients, URL literals, third-party SDKs,
  # runtime package installs): none found beyond the two AWS SDK clients below.
  # pip install runs in a Dockerfile RUN layer (build-time), not at container
  # startup. boto3.client("dsql") only generates a local SigV4 auth token (no
  # network call); the actual TCP connection is the psycopg connect in
  # check_dsql() (app.py:109). Both SSM and DSQL's data plane have VPC interface
  # endpoints, so no call in this app forces NAT.
  egress:
    classification:
      value: none
      confidence: high
      evidence:
        - file: app.py
          line: 20
          excerpt: 'ssm_client = boto3.client("ssm")'
        - file: app.py
          line: 65
          excerpt: 'client = boto3.client("dsql", region_name=config["region"])'
        - file: app.py
          line: 109
          excerpt: 'conn = psycopg.connect(**conn_params)'
    awsServices: [ecr, ecr-docker, logs, s3, ssm, dsql-data]
    externalHosts: []

  hostnames:
    public:
      - value: testing-ecs-truly-auto-mode.sandbox.defiance.ai
        confidence: high
        confirmedByUser: true
        evidence:
          - file: .ecs-auto-mode/manifest.yaml
            excerpt: "supplied by the user; no hostname appears anywhere in the application source"
    internal: []

  datastores:
    - kind: dsql
      planId: dsql-cluster
      nameFound: false   # no cluster identifier literal in code, only env var names
      confidence: high
      evidence:
        - file: requirements.txt
          line: 3
          excerpt: "psycopg[binary]==3.3.4"
        - file: app.py
          line: 65
          excerpt: 'client = boto3.client("dsql", region_name=config["region"])'
        - file: app.py
          line: 68
          excerpt: "client.generate_db_connect_admin_auth_token(...) / generate_db_connect_auth_token(...)"
        - file: app.py
          line: 14
          excerpt: 'DSQL_ENDPOINT_REGION = re.compile(r"\.dsql\.([a-z0-9-]+)\.on\.aws\.?$")'
        - file: app.py
          line: 34
          excerpt: 'endpoint = os.environ.get("DSQL_CLUSTER_ENDPOINT")'
      iamActions:
        - dsql:DbConnect
      dbUser: app_user
      endpointEnvVar: DSQL_CLUSTER_ENDPOINT

  config:
    # DSQL_SSLROOTCERT: python:3.12-slim is Debian-based; psycopg connects with
    # sslmode=verify-full (app.py:98). libpq's default sslrootcert path doesn't exist
    # in this image and its "system" mode needs a hashed-symlink directory Debian
    # slim doesn't ship, so an explicit path is the safe choice per the skill's own
    # guidance (references/analysis/secrets.md). Not independently verified against
    # a live cluster in this run — see the completion report.
    environment:
      - name: DSQL_CLUSTER_USER
        value: app_user
      - name: DSQL_SSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt
      - name: DSQL_DATABASE
        value: postgres  # app.py default; no override needed
      - name: DSQL_PORT
        value: "5432"    # app.py default; no override needed
    secrets: []  # DSQL: IAM token, no password. SSM read: IAM permission only, no secret.

  buildContextPaths:
    - Dockerfile
    - requirements.txt
    - app.py
    - index.html

plan:
  approved: true
  resources:
    - id: vpc
      action: create
      reason: "No existing VPC supplied — 2 AZs, isolated subnets (egress: none)"
    - id: nat-gateway
      action: skip
      reason: "egress.classification is none — app.py:20,65 are the only outbound calls, both VPC-internal"
    - id: vpc-endpoints
      action: create
      parameters:
        services: [ecr, ecr-docker, logs, s3, ssm, dsql-data]
      reason: "egress.classification is none; dsql-data resolved off the created cluster's VpcEndpointServiceName attribute at synth time, not hardcoded"
    - id: cluster
      action: create
      reason: "No existing ECS cluster supplied"
    - id: ecr-repository
      action: create
      reason: "No existing repository supplied; 20-image lifecycle policy"
    - id: load-balancer
      action: create
      parameters:
        scheme: internet-facing
      reason: "Container accepts inbound HTTP on 8080; public hostname requested"
    - id: target-group
      action: create
      reason: "Created in the platform stack alongside the load balancer"
    - id: certificate
      action: create
      parameters:
        hostname: testing-ecs-truly-auto-mode.sandbox.defiance.ai
      reason: "Public hostname requested; hosted-zone is adopt, so DNS validation has a zone to write to"
    - id: hosted-zone
      action: adopt
      identifiers:
        hostedZoneId: Z096698834X7NH86OV1OR
        zoneName: sandbox.defiance.ai
      validated: true
      reason: "Public zone found in the account (aws route53 list-hosted-zones); requested hostname is a subdomain of it"
    - id: dns-record
      action: create
      reason: "A record for testing-ecs-truly-auto-mode.sandbox.defiance.ai in the adopted zone, pointing at the ALB"
    - id: task-security-group
      action: create
      reason: "Allows inbound on 8080 from the ALB security group only"
    - id: alb-security-group
      action: create
      reason: "Allows inbound 443 from the internet (internet-facing, public hostname)"
    - id: task-role
      action: create
      parameters:
        iamActions:
          - "ssm:GetParameter on arn:aws:ssm:us-east-1:581514672367:parameter/cdk-bootstrap/hnb659fds/version"
          - "dsql:DbConnect on the created dsql-cluster (role app_user)"
      reason: "Scoped to exactly the two calls in app.py — no wildcards"
    - id: execution-role
      action: create
      reason: "AmazonECSTaskExecutionRolePolicy only — analysis.config.secrets is empty, so no secret-read grant needed"
    - id: log-group
      action: create
      reason: "Explicit retention period, not the CDK default of infinite"
    - id: dsql-cluster
      action: create
      reason: "aws dsql list-clusters --region us-east-1 returned 0 clusters — nothing to adopt"
    - id: github-oidc-provider
      action: adopt
      identifiers:
        providerArn: arn:aws:iam::581514672367:oidc-provider/token.actions.githubusercontent.com
      validated: true
      reason: "Found via aws iam list-open-id-connect-providers; ClientIDList includes sts.amazonaws.com"
    - id: github-oidc-role
      action: create
      reason: "Trust policy scoped to repo:mbonig/testing-ecs-auto-mode-2:* (and the EMU form)"
    - id: dsql-role-grant
      action: create
      reason: >-
        User-requested addition beyond the standard catalog: a Lambda-backed custom
        resource in the platform stack that runs CREATE ROLE app_user + AWS IAM GRANT
        inside the cluster on deploy, so the manual post-deploy SQL step isn't needed.
        Requires Docker at synth/deploy time to bundle psycopg[binary]; its execution
        role gets dsql:DbConnectAdmin scoped to this one cluster.

pipeline:
  target: github-actions
  branch: main
  pathFilter:
    - Dockerfile
    - requirements.txt
    - app.py
    - index.html
    - infra/.projenrc.ts
    - infra/src/service-stack.ts
  repository: mbonig/testing-ecs-auto-mode-2

